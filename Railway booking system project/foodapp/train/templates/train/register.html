<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackBite - Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1e40af;
            --secondary-blue: #3b82f6;
            --primary-orange: #f97316;
            --secondary-orange: #fdba74;
            --light-bg: #f8fafc;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
        }
        
        .auth-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin: 20px auto;
            max-width: 500px;
        }
        
        .auth-header {
            background: var(--primary-blue);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .auth-body {
            padding: 25px;
        }
        
        .auth-logo {
            font-weight: 700;
            color: white;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .auth-title {
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-blue);
            text-align: center;
        }
        
        .form-control {
            padding: 12px 15px;
            border-radius: 5px;
            border: 2px solid #e2e8f0;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        
        .btn-auth {
            background-color: var(--primary-orange);
            border: none;
            color: white;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .btn-auth:hover {
            background-color: #ea580c;
            transform: translateY(-2px);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }
        
        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .auth-footer a:hover {
            color: var(--primary-orange);
            text-decoration: underline;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        
        .password-strength {
            height: 5px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: flex;
        }
        
        .strength-section {
            flex: 1;
            height: 100%;
            margin: 0 2px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="auth-container">
                    <div class="auth-header">
                        <div class="auth-logo">
                            <i class="fas fa-train me-2"></i>TrackBite
                        </div>
                        <p>Create your account</p>
                    </div>
                    
                    <div class="auth-body">
                        <h3 class="auth-title">Create Account</h3>
                        
                        <form method="POST" action="{% url 'register' %}">
                        {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Username</label>
                                        <input type="text" class="form-control" name="username" placeholder="Enter your User name" required>
                                    </div>
                                </div>
                                
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                            
                            
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                                <div class="password-strength">
                                    <div class="strength-section"></div>
                                    <div class="strength-section"></div>
                                    <div class="strength-section"></div>
                                    <div class="strength-section"></div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" name="password_confirm" class="form-control"  placeholder="Confirm your password" required>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="termsAgree" required>
                                <label class="form-check-label" for="termsAgree">I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></label>
                            </div>
                            
                            <button type="submit" class="btn btn-auth mb-3">Create Account</button>
                        </form>
                        
                        <div class="auth-footer">
                            Already have an account? <a href="{% url 'login'%}">Sign in</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            
                {{ message }}
    </div>
        {% endfor %}
    {% endif %}


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Simple password strength indicator
        document.querySelector('input[type="password"]').addEventListener('input', function(e) {
            const password = e.target.value;
            const sections = document.querySelectorAll('.strength-section');
            let strength = 0;
            
            // Reset all sections
            sections.forEach(section => {
                section.style.backgroundColor = '#e2e8f0';
            });
            
            // Check password strength
            if (password.length > 0) {
                strength++;
                
                if (password.length >= 8) strength++;
                
                if (/[A-Z]/.test(password)) strength++;
                
                if (/[0-9]/.test(password)) strength++;
                
                if (/[^A-Za-z0-9]/.test(password)) strength++;
            }
            
            // Visual indicator (max 4 sections)
            for (let i = 0; i < Math.min(strength, 4); i++) {
                let color;
                if (strength <= 2) color = '#ef4444'; // red
                else if (strength === 3) color = '#f59e0b'; // orange
                else color = '#10b981'; // green
                
                sections[i].style.backgroundColor = color;
            }
        });
    </script>
</body>
</html>
